spring:
  application:
    name: user-service

  #flyway
  flyway:
    enabled: false

  #hibernate
  jpa:
    show-sql: true
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: update
    properties:
      hibernate:
        generate_statistics: false
        format_sql: true

  #db connect
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  #redis caching
#  data:
#    redis:
#      host: ${CACHE_HOST}
#      port: ${CACHE_PORT}
#      password: ${CACHE_PASSWORD}
#  cache:
#    type: redis

#logs
logging:
  level:
    web: INFO